name: Snyk Security Scan (Snyk CLI)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  snyk-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Install Python dependencies
        continue-on-error: true
        run: pip install -r requirements.txt

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk Node scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
        run: |
          echo "============================================"
          echo "  Running: snyk test (npm)"
          echo "  Snyk will scan $GITHUB_WORKSPACE for manifests"
          echo "============================================"
          snyk test --file=package.json

      - name: Run Snyk Python scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
        run: |
          echo "============================================"
          echo "  Running: snyk test (pip)"
          echo "  Snyk will scan $GITHUB_WORKSPACE for manifests"
          echo "============================================"
          snyk test --file=requirements.txt --package-manager=pip

      - name: Publish Node results to Snyk dashboard
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
        run: |
          snyk monitor \
            --file=package.json \
            --project-name=snyk-demo

      - name: Publish Python results to Snyk dashboard
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
        run: |
          snyk monitor \
            --file=requirements.txt \
            --package-manager=pip \
            --project-name=snyk-demo
